name: build-dlss5
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: patch

      - name: Checkout RenoDX
        uses: actions/checkout@v4
        with:
          repository: clshortfuse/renodx
          ref: bc0ead39917634e95c534f7e8cfb59ab82880747
          path: renodx
          submodules: recursive
          fetch-depth: 1

      - name: Install Slang and glslang
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shader-slang/slang --pattern "slang-*-windows-x86_64.zip" -O slang.zip
          Expand-Archive slang.zip -DestinationPath slang
          $names = gh release view -R KhronosGroup/glslang --json assets -q '.assets[].name'
          $names
          $g = $names | Where-Object { $_ -match 'windows' -and $_ -match '\.zip$' -and $_ -notmatch '(?i)debug' } | Select-Object -First 1
          if (-not $g) { $names = gh release view main-tot -R KhronosGroup/glslang --json assets -q '.assets[].name'; $names; $g = $names | Where-Object { $_ -match 'windows' -and $_ -match '\.zip$' -and $_ -notmatch '(?i)debug' } | Select-Object -First 1; $tag = 'main-tot' } else { $tag = '' }
          Write-Host "glslang asset: $g"
          if ($tag) { gh release download $tag -R KhronosGroup/glslang --pattern $g -O glslang.zip } else { gh release download -R KhronosGroup/glslang --pattern $g -O glslang.zip }
          Expand-Archive glslang.zip -DestinationPath glslang
          Get-ChildItem -Recurse glslang -Filter glslang*.exe | Select-Object -First 3 FullName
          New-Item -ItemType Directory -Force renodx\bin | Out-Null
          Copy-Item -Recurse slang\bin\* renodx\bin\
          Get-ChildItem -Recurse glslang -Filter *.exe | Copy-Item -Destination renodx\bin\
          & renodx\bin\slangc.exe -version
          & renodx\bin\glslang.exe --version

      - name: Add DLSS5 addon source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force renodx\src\addons\dlss5 | Out-Null
          Copy-Item -Recurse -Force patch\dlss5\* renodx\src\addons\dlss5\

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        working-directory: renodx
        run: cmake --preset clang-x64

      - name: Build
        shell: pwsh
        working-directory: renodx
        run: cmake --build build --config Release --target renodx-dlss5 -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: renodx-dlss5
          path: renodx/build/Release/renodx-dlss5.addon64
